version: '3.8'

services:
  # Development build
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: dev-builder
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    command: node apps/web/server.js
    volumes:
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/.next/static:/app/apps/web/.next/static

  # Production build
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      target: runner
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3001:3000"
