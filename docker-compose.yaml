services:
  # Local Hardhat blockchain node for testing
  hardhat-node:
    build:
      context: ./packages/contracts
      dockerfile: Dockerfile.hardhat
    ports:
      - "8545:8545"
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/contracts:/app
      - /app/node_modules
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    restart: unless-stopped
    networks:
      - rentinity-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: supa-accelerator/web:latest
    ports:
      - "3000:3000"
    # Load secrets and public envs; override or extend as needed
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEBUG: "next:*" # <- enable all Next.js debug logs
      # Or be more specific:
      # DEBUG: "next:server*,next:router*"

      # Environment variables from .env file
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Server-side variables
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Blockchain variables
      PRIVATE_KEY: ${PRIVATE_KEY}
      NEXT_PUBLIC_PROPERTY_TOKEN_FACTORY_ADDRESS: ${NEXT_PUBLIC_PROPERTY_TOKEN_FACTORY_ADDRESS}
      # Other variables
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}
    depends_on:
      - hardhat-node
    restart: unless-stopped
    networks:
      - rentinity-network

networks:
  rentinity-network:
    driver: bridge
